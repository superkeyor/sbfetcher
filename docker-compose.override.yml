# Override file — port customization for local development.
# Docker Compose merges this automatically on top of docker-compose.yml.
# With this file present, changedetection.io UI is at http://localhost:5555
# (port 5000 is taken by macOS AirPlay Receiver on the dev machine).

services:
    changedetection:
        ports:
            - "5555:5000"

    sbfetcher:
        environment:
            DEBUG_SNAPSHOT: "true"
            DEBUG_SNAPSHOT_DIR: "/root/snapshot"
        volumes:
            - ~/snapshot:/root/snapshot
