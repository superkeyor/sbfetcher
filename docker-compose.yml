# ============================================================================
# changedetection.io + SeleniumBase fetcher
#
# Usage:
#   docker compose up -d
#
# changedetection.io UI: http://localhost:5000
#   (override to :5555 via docker-compose.override.yml for local dev on Mac, because 5000 used by airplay)
# Fetcher:               http://localhost:3000
#   WS   /cdp            -> Chrome CDP relay (for PLAYWRIGHT_DRIVER_URL)
#   GET  /health
# VNC viewer:            http://localhost:3001  (ENABLE_VNC=true; watch Chrome in a web browser)
#
# changedetection.io integration:
#   Playwright fetch:   PLAYWRIGHT_DRIVER_URL=ws://sbfetcher:3000/cdp
#                       (already set below; select "Playwright Chromium/Javascript" per watch)
# ============================================================================

services:
    # NOTE: sbfetcher must be listed first — dup() in the host's ~/.bashrc
    # rebuilds the image named by the first service.
    # --------------------------------------------------------------------------
    # SeleniumBase + FastAPI headless Chrome fetcher
    # --------------------------------------------------------------------------
    sbfetcher:
        image: superkeyor/sbfetcher:latest
        container_name: sbfetcher
        # Fixed hostname: Chrome's profile lock embeds it, so a recreated container
        # (random hostname) would otherwise see the profile as "in use by another computer".
        hostname: sbfetcher
        restart: unless-stopped
        volumes:
            # Persist the Chrome profile (datadome / cf_clearance cookies) across container recreation.
            - /data/sbfetcher/chromiumprofile:/app/chromiumprofile
        ports:
            - "3000:3000"
            - "3001:6080"             # noVNC viewer from the chromiumkit base image (only listens when ENABLE_VNC is "true")
        environment:
            # ---- 1. Likely to change ----------------------------------------------------------------------
            # VNC viewer (chromiumkit base image): "true" serves noVNC on container port 6080, published as
            # http://<host>:3001 above (only shows Chrome while HEADED is "true"). Anyone who can reach that
            # port can then control Chrome; set VNC_PASSWORD to require a password.
            ENABLE_VNC: "true"        # "false": 3001 refuses
            # VNC_PASSWORD: ""
            
            # Optional size limit for the Chrome profile (MB). Leave unset (or 0) to never trim. If the profile is
            # bigger when the container starts, its cache folders are deleted (cached pages, images; Chrome re-creates
            # them); cookies, site storage, extensions and the warm-up memory are kept.
            PROFILE_MAX_MB: "2000"
            
            # Optional: pass extra Chrome flags (space-separated)
            # EXTRA_CHROME_ARGS: "--proxy-server=http://proxy:8080"
            
            # Master switch for the whole warm-up feature. true: a new host, or one whose last visit failed
            # (403/429/503), has its site root visited first (bot check solved, cookies renewed); hosts that went
            # through cleanly are fetched directly. The per-host memory is saved as sbfetcher-hosts.json in the
            # profile volume above. false: no warm-up, no learning, no state file; /cdp is a plain relay to Chrome.
            # The WARMUP_* settings in part 2 only apply while this is true.
            WARMUP: "true"
            
            LOG_LEVEL: "INFO"         # DEBUG / INFO / WARNING
            
            # Debug snapshots: set to "true" to save HTML+PNG to DEBUG_SNAPSHOT_DIR after every warm-up visit.
            # WARNING: DEBUG_SNAPSHOT_DIR defaults to /tmp/sbfetcher which is on the tmpfs below
            # (RAM-only, wiped on restart). Override to a volume path to persist across restarts.
            DEBUG_SNAPSHOT: "false"
            DEBUG_SNAPSHOT_DIR: "/tmp/sbfetcher"

            # ---- 2. Image defaults, listed for reference (the values below are the same as the image's) ----
            HOST: "0.0.0.0"           # must stay 0.0.0.0 for container-to-container traffic over the Docker bridge; host exposure is controlled by port: above
            PORT: "3000"              # port FastAPI listens on inside the container; must match :port above. need for healthcheck
            # Run Chrome on the base image's Xvfb virtual display instead of --headless.
            # Non-headless mode bypasses most Cloudflare/bot-detection checks.
            HEADED: "true"
            WINDOW_WIDTH: "1920"      # Chrome window and Xvfb display width; realistic size reduces bot-detection risk
            WINDOW_HEIGHT: "1080"     # Chrome window and Xvfb display height
            WARMUP_TIMEOUT: "30"      # seconds to load the site root and get through the bot check (Playwright timeouts are set in changedetection)
            WARMUP_COOLDOWN: "300"    # seconds; a needed warm-up is skipped if the host was warmed this recently (0 = no limit)
            WARMUP_ALWAYS_AFTER: "2"  # this many failed direct visits ...
            WARMUP_ALWAYS_DAYS: "90"  # ... within this many days = warm up before every check
            # Map Playwright's new_context() onto the persistent profile so checks reuse its cookies.
            CDP_SHARE_DEFAULT_CONTEXT: "true"
            # Leave unset to use Chrome's real UA (matches navigator.platform / client hints).
            # USER_AGENT: ""
        tmpfs:
            # Chrome writes aggressively to /tmp; use tmpfs for performance + cleanup
            - /tmp:size=512m,mode=1777
        shm_size: "2gb"               # prevent Chrome /dev/shm OOM crashes
        security_opt:
            - no-new-privileges:true  # prevent processes gaining extra capabilities via setuid/setgid binaries
        cap_drop:
            - ALL                     # drop every default capability; only re-add what is strictly needed below
        cap_add:
            - SYS_ADMIN               # required for Chrome sandbox (user-namespace + seccomp) in containers
        healthcheck:
            test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 20s
    # --------------------------------------------------------------------------
    # changedetection.io
    # --------------------------------------------------------------------------
    changedetection:
        image: ghcr.io/dgtlmoon/changedetection.io:latest
        container_name: changedetection
        hostname: changedetection
        restart: unless-stopped
        volumes:
            - /data/changedetection:/datastore
        ports:
            - "5000:5000"
        environment:
            - PUID=1000
            - PGID=1000
            # Playwright fetch: connect_over_cdp() via the /cdp WebSocket proxy
            # Enables the "Playwright Chromium/Javascript via 'ws://sbfetcher:3000/cdp'" option
            - PLAYWRIGHT_DRIVER_URL=ws://sbfetcher:3000/cdp
            # - PLAYWRIGHT_DRIVER_URL=ws://changedetection_playwright:3000/?stealth=1&--disable-web-security=true
            
            - FETCH_WORKERS=2
            - LOGGER_LEVEL=INFO

            # An exclude list (useful for notification URLs above) can be specified with
            - NO_PROXY=localhost,192.168.0.0/24
            
            # Base URL of your changedetection.io install (Added to the notification alert)
            - BASE_URL=https://change.zhupsy.com
            # self-note: do not add USE_X_SETTINGS - otherwise not working properly
            # Respect proxy_pass type settings, `proxy_set_header Host "localhost";` and `proxy_set_header X-Forwarded-Prefix /app;`
            # More here https://github.com/dgtlmoon/changedetection.io/wiki/Running-changedetection.io-behind-a-reverse-proxy
            # - USE_X_SETTINGS=1
            
            # Hides the Referer header so that monitored websites cannot see the changedetection.io hostname.
            - HIDE_REFERER=true
            
            # Not use the 'check version' / telemetry service
            - DISABLE_VERSION_CHECK=true
            
            # Allow fetching URLs that resolve to private/reserved IP ranges (e.g. Cloudflare-proxied sites).
            - ALLOW_IANA_RESTRICTED_ADDRESSES=true
            
            - TZ=America/Chicago
            - LC_ALL=C.UTF-8  # en_US.UTF-8 requires locales package
        
        depends_on:
            sbfetcher:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/').read()"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s
